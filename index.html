    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

    <script>
      // ปิดคลิกขวา (ถ้าไม่อยากปิด ลบสคริปต์นี้ได้)
      document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    </script>

    <style>
      html {
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
          "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      }
      /* วงกลมวิดีโอ */
      .circle-video {
        width: 100px;
        height: 100px;
        border-radius: 9999px;
        overflow: hidden;
        box-shadow: 0 6px 20px rgba(2,6,23,0.15);
        transform: translateZ(0);
        transform-origin: center center;
        transition: transform 0.35s ease, box-shadow 0.35s ease;
        cursor: pointer;
        user-select:none;
        touch-action:manipulation;
      }

      .circle-video:hover,
      .circle-video:focus-visible {
        width:300px; height:300px;
        box-shadow: 0 14px 40px rgba(2,6,23,0.22);
        outline:none;
      }
      .circle-video video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display:block;
        transform: translateZ(0);
      }
    @media (max-width: 720px){
      .hero{grid-template-columns:1fr; gap:5px}
      .circle-video{justify-self:start}
    /* กัน layout ขยับแรงเกินไป: เว้นที่ด้านล่างกล่องข้อความเล็กน้อย */
    .spacer{height:8px}}
    </style>

      const GlassIcon = ({ children }) => (
        <div className="relative grid h-12 w-12 place-items-center rounded-2xl bg-white/30 backdrop-blur-lg ring-1 ring-white/50 shadow-[inset_0_1px_0_rgba(255,255,255,0.6),0_8px_20px_rgba(2,6,23,0.08)]">
          <div className="pointer-events-none absolute inset-0 rounded-2xl bg-gradient-to-br from-white/60 via-white/10 to-white/0"></div>
          <div className="pointer-events-none absolute -bottom-2 h-6 w-10 rounded-[20px] bg-white/20 blur-xl"></div>
          <div className="relative text-slate-900/80 text-xl">{children}</div>
        </div>
      );

      const LiveButton = ({ url }) => (
        <a
          href={url}
          target="_blank"
          rel="noreferrer"
          className="inline-flex items-center gap-2 rounded-full bg-indigo-600/80 backdrop-blur-md px-5 py-2 text-sm font-medium text-white shadow-lg transition-all duration-300 hover:bg-indigo-700 hover:scale-105 focus:outline-none focus:ring-2 focus:ring-indigo-400"
        >
          Live Demo <span aria-hidden="true">↗</span>
        </a>
      );

      const DataButton = ({ url }) => (
        <a
          href={url}
          target="_blank"
          rel="noreferrer"
          className="inline-flex items-center gap-2 rounded-full bg-emerald-600/80 backdrop-blur-md px-5 py-2 text-sm font-medium text-white shadow-lg transition-all duration-300 hover:bg-emerald-700 hover:scale-105 focus:outline-none focus:ring-2 focus:ring-emerald-400"
        >
          View Data <span aria-hidden="true">↗</span>
        </a>
      );

      const App = () => {
        const videoWrapperRef = React.useRef(null);
        const videoRef = React.useRef(null);

        React.useEffect(() => {
            const wrap = videoWrapperRef.current;
            const v = videoRef.current;

            if (!wrap || !v) {
                return;
            }

            v.muted = false; 
            v.setAttribute('playsinline','');
            v.setAttribute('webkit-playsinline','');

            const playMuted = () => {
                if (!v.muted) {
                    v.muted = false;
                }
                v.play().catch(err => console.error("Autoplay muted failed:", err));
            };

            const pauseVideo = () => {
                v.pause();
            };

            const handleClick = (e) => {
                e.preventDefault();
                v.muted = false;
                v.currentTime = 0;
                v.play().catch(err => console.error("Play with sound failed:", err));
            };

            wrap.addEventListener('mouseenter', playMuted);
            wrap.addEventListener('mouseleave', pauseVideo);
            wrap.addEventListener('focus', playMuted);
            wrap.addEventListener('blur', pauseVideo);
            wrap.addEventListener('click', handleClick);

            return () => {
                wrap.removeEventListener('mouseenter', playMuted);
                wrap.removeEventListener('mouseleave', pauseVideo);
                wrap.removeEventListener('focus', playMuted);
                wrap.removeEventListener('blur', pauseVideo);
                wrap.removeEventListener('click', handleClick);
            };
        }, []); 

        return (
        <div>
          <header className="mx-auto max-w-lg px-6 pt-20 pb-6 text-center">
            <h1 className="mt-3 text-xl font-bold tracking-tight text-slate-900 sm:text-6xl">Portfolio</h1>

            {/* 3 บรรทัด */}
            <p className="mx-auto mt-3 max-w-2xl text-lg leading-relaxed text-slate-600">
              <span className="bg-gradient-to-r from-indigo-500 to-purple-600 bg-clip-text font-semibold text-transparent">
                รวมผลงานเด่นด้านเว็บแอปและช่อง YouTube
              </span>
            </p>
            <p className="mx-auto mt-3 max-w-lg text-lg leading-relaxed text-slate-600">
              สร้างขึ้นเพื่อการสร้างคอนเทนต์ การเรียนรู้ และการแบ่งปันความรู้
            </p>
            {/* วิดีโอวงกลม: อยู่กึ่งกลางใต้ 3 บรรทัด */}
            <div className="mt-5 grid place-items-center">
              <div ref={videoWrapperRef} className="circle-video" aria-label="Circle video">
                <video ref={videoRef} playsInline loop preload="metadata">
                  <source src="present.mp4" type="video/mp4" />
                  Your browser does not support video tag.
                </video>
              </div>
            </div>
          </header>

          <main className="mx-auto max-w-5xl px-6 pb-24">
            <div className="grid grid-cols-1 gap-12">
              {projects.map((p, idx) => (
                <article
                  key={idx}
                  className="rounded-3xl border border-slate-200/80 bg-white/60 backdrop-blur-xl shadow-lg transition-all duration-300 hover:-translate-y-1 hover:shadow-2xl"
                >
                  <div className="p-8 sm:p-10">
                    <div className="flex flex-col items-start justify-between gap-6 sm:flex-row sm:items-center">
                      <div className="flex items-start gap-4">
                        <GlassIcon>{p.icon}</GlassIcon>
                        <div>
                          <h2 className="text-2xl font-semibold tracking-tight text-slate-900">{p.title}</h2>
                          <p className="mt-2 text-sm text-slate-600">{p.subtitle}</p>
                        </div>
                      </div>
                      <div className="flex items-center gap-2">
                        <LiveButton url={p.url} />
                        {p.dataUrl ? <DataButton url={p.dataUrl} /> : null}
                      </div>
                    </div>

                    <div className="my-6 h-px bg-slate-200/70"></div>

                    <div className="flex flex-wrap gap-2">
                      {p.badges.map((b, i) => (
                        <span
                          key={i}
                          className="rounded-full border border-slate-200/70 bg-white/50 backdrop-blur px-3 py-1 text-xs font-medium text-slate-700 shadow-sm"
                        >
                          {b}
                        </span>
                      ))}
                    </div>

                    <div className="mt-6 grid grid-cols-1 gap-8 sm:grid-cols-2">
                      <section>
                        <h3 className="text-sm font-semibold text-slate-700">Key Features</h3>
                        <ul className="mt-3 list-disc space-y-2 pl-5 text-sm leading-relaxed text-slate-700">
                          {p.highlights.map((h, i) => (
                            <li key={i}>{h}</li>
                          ))}
                        </ul>
                      </section>
                      <section>
                        <h3 className="text-sm font-semibold text-slate-700">Impact</h3>
                        <ul className="mt-3 list-disc space-y-2 pl-5 text-sm leading-relaxed text-slate-700">
                          {p.impact.map((h, i) => (
                            <li key={i}>{h}</li>
                          ))}
                        </ul>
                      </section>
                    </div>
                  </div>
                </article>
              ))}
            </div>
          </main>

          <footer className="mx-auto max-w-5xl px-6 pb-16 text-center">
            <p className="text-sm text-slate-700 font-medium">Natpaphat Thanapaknanhirun</p>
            <div className="mt-2 text-sm text-slate-600">
              <span className="mx-2">ID 51 ·</span>
              <a href="mailto:jaynatpaphat@gmail.com" className="hover:underline">jaynatpaphat@gmail.com</a>
              <span className="mx-2">·</span>
              <span>Line: jjonline24</span>
            </div>
            
            {/*<div className="mt-3 text-xs text-slate-500">UTCC Generative AI for Business Opportunities #2</div>*/}
          </footer>
        </div>
      );
};
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
